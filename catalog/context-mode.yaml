project_experience: []
suggested_pilot:
  project: Kalshi development workflow — offline catalog diagnostic task
  status: proposed
  scope: One frozen sanitized catalog JSON/log fixture and one saved failing-test output in local Claude Code. Compare
    the same investigation from clean sessions with/without pinned context-mode; use existing bounded scripts as
    baseline. No production access or application dependency changes.
  success_criteria:
  - Find every preselected fact and seeded failure with exact source references; no missed errors or permission
    widening.
  - At least 50% fewer returned tool-output bytes; record host input/output/cache tokens separately and do not equate
    bytes with dollars.
  - Finish within 20% of baseline elapsed time; report local peak RSS, disk growth, hook overhead and reruns. No
    Railway savings attribution.
  - Force one compaction and verify current task, edited files and pending decision recovery against repository
    records.
  - Verify unconfigured remote forwarding, existing deny rules, single hook firing and clean rollback without replacing
    instructions.
  measure:
  - answer-completeness
  - exact-source-retrieval
  - tool-output-bytes
  - host-model-usage
  - elapsed-time
  - local-peak-rss
  - disk-growth
  - hook-reliability
  - compaction-recovery
  - setup-and-rollback-effort
  note: Proposed only. No pilot begun; this record does not authorize installation or live-system changes.
