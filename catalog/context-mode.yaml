  - Scientific Agent Skills is a reviewed methodology/analysis candidate; context-mode handles retrieval/output,
    not scientific validity.
  - Build OS is shared durable memory; a local index is supplemental.
  - rg, bounded Python/SQL scripts and selective reads remain the lower-maintenance baseline. No context-mode installation
