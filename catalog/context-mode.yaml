  notes:
  - Developer-host tooling, independent of application runtime; not an application dependency or hosted database
    replacement.
  - 'Package requires Node.js >=22.5. Optional execution languages need their own runtimes. SQLite backend varies:
    Bun built-in, Linux node:sqlite when available, otherwise better-sqlite3.'
  - README documents automatic Claude Code plugin hooks; MCP-only mode lacks automatic routing. Compatibility in
    the user's actual clients is unverified.
  - Cursor docs report a rejected sessionStart event, unsurfaced additional_context, no shipped preCompact hook,
    and routing via .mdc rules. Marketplace availability is described as pending in the reviewed README.
  - Codex CLI integration is documented with version-dependent hooks/feature flags. This does not establish compatibility
    with hosted ChatGPT Work, iPhone apps or connector tools.
  - Existing AGENTS.md, CLAUDE.md, Build OS records and permissions remain authoritative. Merge necessary routing
    guidance if piloted; never replace project instructions with an upstream template.
use_when:
- A supported coding agent consumes large logs, JSON exports, history or docs and approaches its context limit.
- Analyze bounded local artifacts in code and return selected facts while retaining full sources for exact follow-up.
- Search technical documentation or session events while keeping approved decisions and checkpoints in the repository.
avoid_when:
- rg, SQL, small outputs or existing bounded scripts already answer the question; more hooks/tools add maintenance.
- Seeking direct reductions in production RAM, database growth or hosting charges.
- Seeking permanent shared memory, cross-device chat sync or a replacement for Build OS records.
- The client cannot run local MCP/hooks, or every external connector response must be intercepted automatically.
- Seeking OS isolation for arbitrary code or a hosted service exposing substantial context-mode functionality.
limitations:
- Documentation and representative source/test review only. No installation, upstream code execution, tests, benchmarks
  or project integration were performed.
- README advertises about 98% reduction and longer sessions. BENCHMARK.md reports 96% overall on fixtures and 82%
  for exact-chunk retrieval. These upstream byte measurements do not establish task accuracy, billed-token savings
  or savings in our projects.
- Routing must happen before raw output reaches context. Registering tools does not transparently compress every
  other MCP/connector response; results depend on client hooks and agent behavior.
- Summaries and ranked retrieval can omit decisive facts. Preserve exact source, exit status, errors and acceptance
  criteria for inspection.
- Session recovery is host/version dependent and best-effort. README fresh-session deletion language differs from
  sessionstart.mjs age-gated cleanup/resume paths. Do not promise permanent memory or exact retention without measuring
  it.
- Sandbox means subprocess execution with process filesystem access, not OS isolation. Executor preserves most environment
  variables after a targeted denylist; keep host controls and avoid production credentials.
- README says nothing leaves the machine, but hooks/platform-bridge.mjs forwards events to platform_url/events when
  valid platform.json credentials exist. Local mode needs no account; verify forwarding is unconfigured before asserting
  local-only behavior.
- Elastic License 2.0 is source-available with hosted/managed-service, license-key and notice limitations; not permissive
  MIT/Apache licensing.
- Open-issue list returned empty and direct historical issue reads returned 410 Issues are disabled. README-linked
  reports could not be independently inspected; absence of results is not absence of defects.
- Five recent default-branch commits inspected were automated install-stat updates. Latest release observed was
  v1.0.169, published 2026-06-29; recent commits do not establish runtime validation.
requirements:
- Supported developer host running local MCP, Node.js >=22.5 and compatible SQLite backend.
- Writable local content/session storage and required execution runtimes; local CPU/RAM/disk overhead is unmeasured.
- Client-specific MCP/hook/routing setup preserving project rules and permissions; verify duplicate registration
  and rollback.
- Sanitized offline artifacts for evaluation; no production credentials, writes, trading authority or new production
  service.
cost:
  license: Elastic-2.0; royalty-free under license conditions, including restrictions on hosted/managed access to
    substantial functionality.
  model_usage: Core execution and FTS5 search require no extra model API or embedding account. Host model/provider
    usage still applies; net savings unmeasured.
  infrastructure: Local MCP process, subprocesses, SQLite and hooks; no cloud service required for local mode. Optional
    Insight/platform pricing and data handling not evaluated.
