schema_version: 1
id: tokenspeed
name: TokenSpeed
repository: https://github.com/lightseekorg/tokenspeed
description: GPU LLM inference and serving engine with a C++ scheduler, Python execution, modular accelerator kernels, and an SMG-backed OpenAI-compatible HTTP gateway.
categories: [ai-agents, developer-workflow, deployment]
keywords: [llm-inference, self-hosting, gpu, cuda, rocm, low-latency, openai-compatible, prefix-cache, speculative-decoding, keyboard, autocorrect]
stage: reviewed
reviewed_on: '2026-10-15'
tested_version: null
compatibility:
  stacks: [python, pytorch, cpp, openai-compatible-http, cuda, rocm]
  platforms: [linux-gpu-server]
  notes:
    - Python package requires Python 3.11 or newer; documented nightly environments use Python 3.11-3.13.
    - Getting-started paths cover NVIDIA CUDA and AMD ROCm 7.2; exact model, quantization, driver, and kernel compatibility must be pinned.
    - HTTP clients can live in a TypeScript or Python application while inference runs on a separate compatible GPU host.
    - No native iPhone or Apple Metal execution path was established by the inspected guides; an iPhone keyboard would be a network client.
    - OpenAI-compatible chat examples do not establish complete parity with every hosted-provider feature or model.
use_when:
  - Operating a supported open-weight text model on compatible GPUs, with measured inference latency or throughput as an actual bottleneck.
  - Reusing repeated prompt prefixes or testing model-specific speculative decoding on a representative workload.
  - Evaluating a backend for low-latency contextual keyboard suggestions after a keyboard project and serving requirements exist.
avoid_when:
  - Trying to accelerate ChatGPT or Claude subscriptions without replacing the underlying model-serving infrastructure.
  - Replacing the existing ElevenLabs text-to-dialogue audio renderer in Build OS Radio.
  - Reducing the RAM footprint of a bounded database/catalog worker that has no established GPU inference requirement.
  - Expecting a ready-made autocorrect model, native keyboard UI, personalized typo model, or a guarantee of instant mobile responses.
limitations:
  - README performance claims and vendor-hardware benchmarks were not reproduced; output tokens per second do not measure mobile request-to-suggestion latency.
  - GPU inference introduces model storage, VRAM, driver/kernel alignment, capacity planning, monitoring, and availability work.
  - Latest release observed was v0.1.1 dated 2026-10-06; this review inspected a newer main commit, not a hands-on validation of that release.
  - Main has active dependency and kernel changes; tested model/hardware combinations cannot be inferred from general API compatibility.
  - Inspected integration tests include a fake-engine gateway readiness/shutdown test; its presence does not establish real-model correctness or benchmark performance.
  - Open issue 2399 reports streaming cumulative-logprob behavior; issue 2397 reports a repetition-penalty boundary problem. These are issue reports, not reproduced defects in this review.
  - Optional Mooncake L3 production hardening has an open roadmap; do not infer fleet-wide cache readiness from core serving availability.
  - The documented development container uses privileged host access and 32 GiB shared memory; it is an example environment, not a verified minimal deployment requirement.
  - Server-backed keyboard suggestions depend on network availability, queueing, prompt processing, first-token latency, and remaining decode time.
requirements:
  - Compatible accelerator host, sufficient model-specific VRAM and host memory, checkpoint storage, and matching CUDA or ROCm dependencies.
  - Access to chosen model checkpoints; any gated-model account/token and model-license obligations depend on that model.
  - Pin the runtime, scheduler, SMG gateway, kernels, model revision, and serving options together.
  - For remote clients, a secured serving endpoint with appropriate access controls; no hosted model-provider API key is inherently required for locally served weights.
  - For an iOS networked custom keyboard, a native keyboard extension with RequestsOpenAccess and explicit user Allow Full Access.
cost:
  license: MIT at repository root; retain inherited file and third-party notices, including Apache-2.0 portions. Model licenses are separate.
  model_usage: No mandatory hosted-model token charge for self-hosted weights; model access and licenses vary. No usage savings measured.
  infrastructure: GPU purchase/rental, idle capacity, storage, traffic, power and operational time; no provider quote or break-even measured.
