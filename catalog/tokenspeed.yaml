project_experience: []
suggested_pilot:
  project: Proposed custom keyboard
  status: proposed
  condition: Only if the keyboard proceeds, a compatible model/GPU is available, and server inference is a measured bottleneck; not recommended as immediate infrastructure work.
  scope: Offline fixed typo/context corpus plus a native-device suggestion prototype; compare the same model/settings on TokenSpeed and an available baseline server, with a local correction fallback.
  measure:
    - End-to-end p50/p95 time to a complete usable suggestion on Wi-Fi and cellular, including warm and cold requests.
    - Correction precision, harmful overcorrections, names/code preservation, suggestion acceptance and stale-response rejection.
    - GPU/host memory, concurrency, failures, disconnect behavior, operating cost per active typing hour and setup/maintenance effort.
  success_criteria:
    - Local typing and basic correction remain responsive offline and never wait for a remote result.
    - Provisional product target of warm p95 complete suggestions within 250 ms; a design target, not an established capability.
    - Quality does not regress against the declared baseline; quantify expensive wrong corrections rather than scoring throughput alone.
    - Reject stale results after further typing or cursor movement; preserve meaning and require user acceptance for substantial rewrites.
  note: Proposed evaluation only. No model installed, upstream code executed, device test, GPU provisioning, application edit, or live-system change performed.
