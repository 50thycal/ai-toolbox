  - parquet
  platforms:
  - cursor
  - claude-code
  - codex
  - local-analysis
  notes:
  - README advertises compatible Agent Skills hosts and plugin.json packaging; installation/discovery in the user's
    hosts was not tested.
  - Repository tooling requires Python 3.13+; selected hypothesis-generation and core EDA tools require Python 3.11+
    standard library. Experimental design and statistical analysis declare Python 3.12+; Polars skill declares Python
    3.10+.
  - Use separate environments for optional scientific packages; the reviewed experimental-design and statistical-power
    examples pin different pandas versions. Skill files do not install their dependencies.
  - Use as an offline research aid. It does not integrate with the existing experiment registry, market catalog,
    database permissions, qualification rules or trade execution.
use_when:
- Auditing a proposed research thesis for rival explanations, falsifiable predictions, estimands, missingness, leakage
  and explicit exploratory versus confirmatory scope.
- Designing event-clustered treatment/control allocation and justified sensitivity or power calculations before
  collecting new outcomes.
- Profiling a bounded exported dataset or considering lazy Polars file processing after identifying a measured bottleneck.
avoid_when:
- Seeking an autonomous trading strategy, a calibrated market ranking, a confidence score or authorization to change
  a live experiment.
- Existing project SQL, bounded stdlib scripts and Experiment OS contracts already answer the question without additional
  maintenance.
- Seeking alarm delivery fixes, native iPhone testing or a replacement speech renderer.
limitations:
- Documentation and representative source/test inspection only; no installation, dependency resolution, script execution,
  benchmarks, model runs or project integration were performed.
- Most of the 177 advertised skills concern scientific domains outside the current projects. Prefer a pinned topical
  subset over installing the collection.
- Hypothesis validators check schema, declarations and internal consistency; passing cannot prove scientific truth,
  independent outcomes, causal identification or profitability.
- Generic fixed-horizon tests and power examples do not validate the project's existing sequential gates. Model
  event/exposure dependence, assignment denominators, missing/unfilled outcomes and rare losses explicitly.
- Polars streaming may reduce intermediate memory, but collect still materializes the final DataFrame and some operations
  require substantial memory. No RAM, runtime or hosting-cost reduction has been measured.
- CI runs structural checks and standard-library suites; the workflow explicitly excludes the full scientific dependency
  sweep. Tests exist, but their presence is not our hands-on result.
- 'Open citation-management issues #317/#318 report parser and DOI-deduplication defects; these are reports, not
  reproduced findings, and do not establish defects in the shortlisted skills.'
- Recent scan-only commits do not establish recent functional testing. Upstream scan/triage results are not a blanket
  security certification.
requirements:
- An Agent Skills-capable host, review of each selected skill's instructions/scripts and a pinned release or commit.
- Authorized, minimized local exports with preserved timestamps, exposure groups, split boundaries and provenance.
- No credentials or network are needed by the reviewed hypothesis-generation/core EDA scripts after provisioning
  Python; optional package installation requires network access.
- Experimental-design uses NumPy/pandas and pydoe for DOE; statistical-power uses its separately documented SciPy/statsmodels
  stack. Network/database/hosted-model skills elsewhere have separate access requirements.
- Retain project-specific governance and compare against the existing research workflow before adding parallel schemas.
cost:
  license: Repository MIT; per-skill/dependency licenses must also be checked. Selected hypothesis, EDA, design
    and analysis skills declare MIT; Polars skill links its upstream license.
  model_usage: No bundled model inference in the reviewed local validators. Agent-host/model usage remains provider-dependent
    and unmeasured; other skills may call paid services.
  infrastructure: Local or isolated batch analysis can avoid adding a resident production service. CPU/RAM/runtime
    and any model/API cost are unmeasured; no hosting savings claimed.
