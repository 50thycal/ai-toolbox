name: Scientific Agent Skills (K-Dense)
repository: https://github.com/K-Dense-AI/scientific-agent-skills
description: Portable research skills with procedural guidance, local validators, experiment-design helpers and
  scientific Python recipes; selectively useful for offline hypothesis and data-quality review.
