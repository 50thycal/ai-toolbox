    the candidate adds reusable review aids, not those capabilities from scratch.
project_experience: []
suggested_pilot:
  project: Kalshi research
  status: proposed
  scope: 'One offline comparison on a new, unstarted catalog-backed thesis: baseline existing Experiment OS review
    versus a pinned hypothesis-generation/experimental-design subset. Use public or sanitized bounded fixtures;
    adapt outputs to the existing contract.'
  success_criteria:
  - All hypotheses remain candidates; source links, rivals, falsifiers, analysis unit and holdout boundary are explicit.
  - All fixture records sharing an event/exposure group stay together in allocation; unfilled/rejected/missing outcomes
    and the per-assigned-opportunity denominator remain visible.
  - Identify a material omission missed by the baseline or demonstrate reduced review effort without lost contract
    coverage; otherwise keep as reference-only.
  - Repeat with fixed input/seed/version and compare outputs; record review time, runtime, peak memory, model usage/cost
    and maintenance effort.
  - No new production dependency/service, credential access, live order, registry transition or change to frozen
    experiment gates.
  note: Proposal only; not started or authorized for execution by this record. Add power simulation only in a separately
    specified analysis if justified by the chosen design.
