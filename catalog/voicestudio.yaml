project_experience: []
suggested_pilot:
  project: Build OS Radio
  status: proposed
  scope: On an existing compatible local machine, compare one consented two-speaker script of 3 to 5 minutes against an existing ElevenLabs render; include technical names, numbers, and a chapter break.
  prerequisites:
    - Record the actual chip, RAM, OS, exact app version/commit and model revision; select assets whose terms cover the intended test.
    - Keep the experiment outside the deployed publishing pipeline; use an existing baseline render to avoid unapproved API spending.
  success_criteria:
    - Every turn appears once, in order, with distinct stable speaker identities and no missing chapter.
    - Listener accepts naturalness, pacing, and technical pronunciation relative to the baseline; record specific corrections.
    - Record cold/warm render time, peak memory, disk use, manual repair time, and any failure or restart behavior.
    - Verify a final MP3 plays and seeks correctly on the intended phone/player; check duration and chapter cue accuracy.
    - Estimate monthly total cost and local-machine availability from measured runtime before deciding whether savings justify integration.
  note: Proposal only; no pilot started, application code changed, or spending authorized by this catalog record.
