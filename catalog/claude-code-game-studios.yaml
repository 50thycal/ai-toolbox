  notes:
  - Development-host template, not a game engine, hosted studio, game runtime or application SDK. Tree contains
    49 agent definitions and 74 skill entrypoints; no package.json, pyproject.toml or requirements.txt dependency
    manifest was found.
  - Representative test runner explicitly accepts Godot, Unity and Unreal only, even with --cmd. Browser Canvas/Vite
    and Next.js applications need adapted paths, commands, evidence capture and review contracts; TypeScript support
    is not established by generic prompt text.
  - Claude Code project hooks/settings and question/delegation APIs are host-specific. No compatibility with ChatGPT
    Work, Codex CLI, mobile clients or subscription inference was tested.
  - Upstream offers minimal/standard/full rigor and collaborative/guided/autonomous settings. Minimal can waive
    automated logic tests; retain each existing project's stronger test requirements.
  - Existing AGENTS.md, Build OS decisions and project-specific playtest skills stay authoritative. Do not replace
    them or bulk-copy .claude/settings.json to adopt a checklist.
use_when:
- Reviewing an explicit game economy or progression model against stated targets, resource faucets/sinks and dominant-strategy
  risks.
- Adding acceptance-criterion traceability, retained visual evidence and stale-evidence checks to a bounded game
  feature.
- Considering a new Godot/Unity/Unreal project after selecting that engine and verifying its current official documentation.
avoid_when:
- Seeking an autonomous idea-to-shipped-game service, measured quality improvement, or proof that 49 roles outperform
  an existing focused workflow.
- Seeking direct integration with an existing Vite/Canvas or Next.js runtime, an iPhone build pipeline, production
  reliability repair or lower inference RAM.
- Existing seeded sweeps, reducer tests and Build OS records already solve the task; extra registries and approval
  loops would duplicate maintenance.
- Interpreting a game-design balance review as scientific validation of AI behavior, calibrated model trust or causal
  evidence.
limitations:
- Documentation and representative code/spec review only. No installation, upstream code execution, engine launch,
  test run, model session, benchmark or application integration was performed.
- README describes internal game-building comparisons and successful engine checks, but does not ship those games.
  These are upstream claims, not reproduced results; document volume is not evidence of game quality.
- Balance-check is primarily a model-guided analysis procedure using data and declared targets. Its no-data and
  NOT ASSESSED paths are useful, but it does not supply this portfolio's deterministic simulation or automatically
  prove balanced play.
- studio-tests ships structural and behavioral Markdown specifications for the framework, not this portfolio's game
  tests. Presence of specs and upstream release claims do not establish independently passing CI; no .github/workflows
  files were found at the reviewed tree.
- Evidence screenshots can demonstrate layout/presence but not timing, feel, audio, real-device touch behavior or
  long-run simulation reliability. story-done allows deferred playtest criteria; preserve project-specific acceptance
  gates.
- Framework paths, registries, helper scripts and settings are coupled. Extracting one SKILL.md is not a self-contained
  installation; full adoption creates upgrade/merge work.
- 'Open issue #147 reports non-atomic stage writes at this exact commit; open PR #148 proposes a fix. Static inspection
  shows project.yaml written before stage.txt and no paired rollback, but the failure scenario was not reproduced.'
- 'Open issue #143 reports inaccuracies in version-qualified Godot reference guidance. Treat as a report, not an
  independently verified engine defect; use official engine docs for consequential decisions.'
- Hooks can read project files and write local state/logs; host model processing and filesystem permissions still
  apply. Optional update-check contacts GitHub for releases and can be disabled. No privacy or security certification
  was performed.
requirements:
- Claude Code account/entitlement and a developer host with Git, Bash and Python 3; jq recommended by upstream.
  Native Claude Code install is documented; npm install route requires Node.js 22+.
- Engine installation and engine-specific test tooling for full workflow use; runtime hosting still follows the
  application's own stack.
- Explicit mapping of source/data/test/evidence paths and preservation of project instructions, custom skills, historical
  data and access controls before any future integration.
- A pinned, isolated project snapshot and bounded fixtures for a pilot; avoid live application mutation or changing
  simulation rules merely to evaluate the workflow.
cost:
  license: MIT; preserve copyright and permission notice for copied substantial portions. Host services, model access
    and engines have separate terms.
  model_usage: Claude Code usage applies. Three director prompts request Opus, others use Sonnet or inherit the
    session model; number of calls, subscription quota impact, API spend and net benefit are unmeasured. No free
    or ChatGPT-subscription execution claim.
  infrastructure: No new hosted service or GPU is required by the template itself. Developer machine, engine/browser
    tools, local artifacts and optional CI consume resources; setup, runtime and maintenance costs are unmeasured.
