  comparison:
  - Build OS v0.12 already provides owner decisions, project memory and review flow; retain it as the shared protocol
    rather than adding a competing studio hierarchy.
  - Straitwatch's seesaw-eval/playtest-fidelity and seeded V3 sweeps are the baseline. Evaluate only whether borrowed
    target/evidence discipline adds a material finding.
  - TesterArmy e2e is a reviewed browser-testing candidate; CCGS specifies what evidence to require but does not
    supply browser automation for these applications.
  - Scientific Agent Skills is a reviewed research-methodology candidate; game balance and narrative quality do
    not establish causal or statistical validity.
  - Context Mode is a reviewed context-management candidate; CCGS read guards/checkpoints partly overlap but do
    not replace local retrieval or demonstrate token savings.
project_experience: []
suggested_pilot:
  project: Straitwatch V3 — one Armory progression review
  status: proposed
  scope: In an isolated copy pinned to the recorded default-branch commit, review one Armory bay using existing
    data, explicit owner-approved targets and a frozen seeded-sweep fixture. Compare existing project workflow with
    an adapted CCGS balance/evidence checklist. If a representative change is approved separately, use existing
    Vitest and browser smoke tooling to verify it; no engine migration, full-template installation or live deployment.
  success_criteria:
  - Every numerical finding names a source, stated target and measured evidence; missing targets and unavailable
    runs are NOT ASSESSED, with zero invented measurements.
  - Produce at least one owner-accepted actionable finding absent from the baseline review, or conclude that the
    template adds insufficient value.
  - Cover each chosen acceptance criterion with actual test output or opened retained browser screenshots; changing
    a covered file must flag evidence for recheck.
  - Preserve existing playtest skills, rules, saves, Build OS records and test requirements. Record clean rollback
    and any required helper/path adaptations.
  - Measure elapsed time, model usage or quota where available, calls/retries, setup effort, false findings and
    maintenance burden against the baseline; report unavailable cost data as unknown.
  note: Proposed only. No pilot begun or authorized by this catalog record.
